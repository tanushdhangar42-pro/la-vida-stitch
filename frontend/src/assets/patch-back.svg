<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img">
<defs>
<linearGradient id="cv" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#1c1f27"/><stop offset="55%" stop-color="#12141a"/><stop offset="100%" stop-color="#0b0c10"/>
</linearGradient>
<filter id="weave" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
<feColorMatrix in="n" type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
</filter>
<radialGradient id="lift" cx="34%" cy="24%" r="78%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>

<pattern id="pb_loop" width="10" height="10" patternUnits="userSpaceOnUse">
<rect width="10" height="10" fill="#2b2f36"/>
<circle cx="2.5" cy="2.5" r="1.5" fill="#3d434c"/>
<circle cx="7.5" cy="7.5" r="1.5" fill="#3d434c"/>
<circle cx="7.5" cy="2.5" r="1" fill="#353b43"/>
<circle cx="2.5" cy="7.5" r="1" fill="#353b43"/>
</pattern>
<pattern id="pb_hook" width="12" height="12" patternUnits="userSpaceOnUse">
<rect width="12" height="12" fill="#23262c"/>
<path d="M2 9 V4 C2 2 6 2 6 4.5" fill="none" stroke="#565c66" stroke-width="1.3" stroke-linecap="round"/>
<path d="M8 10 V5 C8 3 12 3 12 5.5" fill="none" stroke="#565c66" stroke-width="1.3" stroke-linecap="round"/>
</pattern>
</defs>
<rect x="6" y="6" width="388" height="388" rx="9" fill="url(#cv)"/>
<rect x="6" y="6" width="388" height="388" rx="9" filter="url(#weave)" opacity="0.55"/>
<rect x="6" y="6" width="388" height="388" rx="9" fill="url(#lift)"/>
<g>
<rect x="56" y="56" width="288" height="288" rx="4" fill="url(#pb_hook)"/>
<rect x="56" y="56" width="288" height="288" rx="4" fill="none"
 stroke="#0a0b0e" stroke-opacity="0.8" stroke-width="3"/>
<rect x="50" y="50" width="300" height="300" rx="6" fill="none"
 stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="6 6"/>
