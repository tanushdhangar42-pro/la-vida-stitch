server.port=8080

# ---- MySQL (values can be overridden with environment variables, which Docker Compose does) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lavida_stitch?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA / Hibernate: creates and updates the tables automatically ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
# The secret must be at least 32 characters long. Change it for a real deployment.
app.jwt.secret=${JWT_SECRET:la-vida-stitch-development-secret-key-change-me-123456}
app.jwt.expiration-ms=86400000

# ---- First admin account, created automatically on the first start ----
app.admin.email=${ADMIN_EMAIL:admin@lavidastitch.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
